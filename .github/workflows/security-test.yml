name: 🔐 LexGuard AI — Vulnerability & Security Testing

on:
  push:
    branches: [ main ]
    paths:
      - 'automation/security-testing/**'
      - '.github/workflows/security-test.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API Base URL'
        required: false
        default: 'https://pdd-uw63.onrender.com'

permissions:
  contents: read
  actions: write

env:
  DEFAULT_TARGET_URL: 'https://pdd-uw63.onrender.com'
  ARTIFACT_RETENTION_DAYS: 30

jobs:
  security-test:
    name: 🔐 Vulnerability & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'automation/security-testing/package.json'

      - name: 📦 Install Security Testing Node Dependencies
        working-directory: automation/security-testing
        run: |
          npm ci || npm install

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📁 Prepare Security Testing Output Directories
        run: |
          mkdir -p automation/security-testing/reports/raw
          mkdir -p automation/security-testing/reports/final

      - name: 🎯 Validate Target API Availability
        env:
          LEXGUARD_API_URL: ${{ secrets.LEXGUARD_API_URL || github.event.inputs.target_url || env.DEFAULT_TARGET_URL }}
        run: |
          TARGET="${LEXGUARD_API_URL}"
          echo "🎯 Validating target API connectivity at: ${TARGET}"
          curl -s -f -I "${TARGET}/" || curl -s -I "${TARGET}/" || echo "Warning: Target probe returned non-200"

      - name: 🏃 Execute Automated Security Scanner
        id: run_security_scan
        working-directory: automation/security-testing
        env:
          LEXGUARD_API_URL: ${{ secrets.LEXGUARD_API_URL || github.event.inputs.target_url || env.DEFAULT_TARGET_URL }}
          TARGET_URL: ${{ secrets.LEXGUARD_API_URL || github.event.inputs.target_url || env.DEFAULT_TARGET_URL }}
        run: |
          echo "🔐 Executing LexGuard vulnerability & security scanner..."
          npm run test:security

      - name: 📊 Generate Security Excel Report
        if: always()
        working-directory: automation/security-testing
        env:
          LEXGUARD_API_URL: ${{ secrets.LEXGUARD_API_URL || github.event.inputs.target_url || env.DEFAULT_TARGET_URL }}
        run: |
          echo "📊 Generating Excel Security Report..."
          npm run report

      - name: 🔍 Verify Vulnerability Excel Report
        if: always()
        run: |
          EXCEL_PATH="automation/security-testing/reports/final/LexGuard_Vulnerability_Test_Report.xlsx"

          echo "Checking: ${EXCEL_PATH}"

          if [ ! -f "${EXCEL_PATH}" ]; then
            echo "ERROR: Vulnerability Excel report was not generated"
            exit 1
          fi

          FILE_SIZE=$(wc -c < "${EXCEL_PATH}" | tr -d ' ')

          if [ "${FILE_SIZE}" -le 0 ]; then
            echo "ERROR: Vulnerability Excel report is empty"
            exit 1
          fi

          echo "Security Excel Report generated successfully"
          echo "File: ${EXCEL_PATH}"
          echo "Size: ${FILE_SIZE} bytes"

      - name: 📤 Upload Vulnerability Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LexGuard-Vulnerability-Test-Excel-Report
          path: automation/security-testing/reports/final/LexGuard_Vulnerability_Test_Report.xlsx
          retention-days: 30
          if-no-files-found: error

      - name: 📦 Upload Raw Security Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LexGuard-Vulnerability-Raw-Evidence
          path: automation/security-testing/reports/raw/
          retention-days: 30
          if-no-files-found: warn
