name: ⚡ LexGuard AI — Load Testing

on:
  push:
    branches: [ main ]
    paths:
      - 'automation/load-testing/**'
      - '.github/workflows/load-test.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API Base URL'
        required: false
        default: 'https://pdd-uw63.onrender.com'
      stage_1_vus:
        description: 'Stage 1 Peak VUs (30s)'
        required: false
        default: '5'
      stage_2_vus:
        description: 'Stage 2 Peak VUs (30s)'
        required: false
        default: '10'
      stage_3_vus:
        description: 'Stage 3 Peak VUs (60s)'
        required: false
        default: '20'
      stage_4_vus:
        description: 'Stage 4 Peak VUs (60s)'
        required: false
        default: '30'
      stage_5_vus:
        description: 'Stage 5 Peak VUs (30s)'
        required: false
        default: '0'

permissions:
  contents: read
  actions: write

env:
  DEFAULT_TARGET_URL: 'https://pdd-uw63.onrender.com'
  ARTIFACT_RETENTION_DAYS: 30

jobs:
  load-test:
    name: ⚡ Backend API Load Testing
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'automation/load-testing/package.json'

      - name: 📦 Install Load Testing Node Dependencies
        working-directory: automation/load-testing
        run: |
          npm ci || npm install

      - name: 🛠️ Install k6 Load Testing Tool
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v0.50.0/k6-v0.50.0-linux-amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/k6-v0.50.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: 📁 Prepare Load Testing Output Directories
        run: |
          mkdir -p automation/load-testing/reports/json
          mkdir -p automation/load-testing/reports/final

      - name: 🏃 Execute k6 Load Test Suite
        id: run_load_test
        working-directory: automation/load-testing
        env:
          LEXGUARD_API_URL: ${{ secrets.LEXGUARD_API_URL || github.event.inputs.target_url || env.DEFAULT_TARGET_URL }}
          TARGET_URL: ${{ secrets.LEXGUARD_API_URL || github.event.inputs.target_url || env.DEFAULT_TARGET_URL }}
          STAGE_1_VUS: ${{ github.event.inputs.stage_1_vus || '5' }}
          STAGE_2_VUS: ${{ github.event.inputs.stage_2_vus || '10' }}
          STAGE_3_VUS: ${{ github.event.inputs.stage_3_vus || '20' }}
          STAGE_4_VUS: ${{ github.event.inputs.stage_4_vus || '30' }}
          STAGE_5_VUS: ${{ github.event.inputs.stage_5_vus || '0' }}
        run: |
          TARGET="${LEXGUARD_API_URL}"
          if [ -z "${TARGET}" ]; then
            echo "❌ ERROR: Target API URL is missing or empty"
            exit 1
          fi
          echo "🎯 Target API Base URL: ${TARGET}"
          echo "⚡ Executing k6 performance test..."
          k6 run load-test.js

      - name: 📊 Generate Load Test Excel Report
        if: always()
        working-directory: automation/load-testing
        env:
          LEXGUARD_API_URL: ${{ secrets.LEXGUARD_API_URL || github.event.inputs.target_url || env.DEFAULT_TARGET_URL }}
        run: |
          echo "📊 Generating Excel Load Test Report..."
          npm run report

      - name: 🔍 Verify Load Test Excel Report
        if: always()
        run: |
          EXCEL_PATH="automation/load-testing/reports/final/LexGuard_Load_Test_Report.xlsx"

          echo "Checking: ${EXCEL_PATH}"

          if [ ! -f "${EXCEL_PATH}" ]; then
            echo "ERROR: Load test Excel report was not generated"
            exit 1
          fi

          FILE_SIZE=$(wc -c < "${EXCEL_PATH}" | tr -d ' ')

          if [ "${FILE_SIZE}" -le 0 ]; then
            echo "ERROR: Excel report is empty"
            exit 1
          fi

          echo "Load Test Excel Report:"
          echo "Path: ${EXCEL_PATH}"
          echo "Size: ${FILE_SIZE} bytes"

      - name: 📤 Upload Load Test Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LexGuard-Load-Test-Excel-Report
          path: automation/load-testing/reports/final/LexGuard_Load_Test_Report.xlsx
          retention-days: 30
          if-no-files-found: error

      - name: 📤 Upload Debugging Raw k6 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LexGuard-Load-Test-Raw-Results-${{ github.run_number }}
          path: automation/load-testing/reports/json/
          retention-days: 7
          if-no-files-found: warn
