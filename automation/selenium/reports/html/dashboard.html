<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LexGuard AI – Executive Dashboard</title>
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; padding: 32px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; }
    .card-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
    .card-value { font-size: 36px; font-weight: 700; margin-top: 8px; }
  </style>
</head>
<body>
  <h1 style="color: #38bdf8;">LexGuard AI – Executive QA Automation Dashboard</h1>
  <div class="kpi-grid">
    <div class="card"><div class="card-title">Total Test Cases</div><div class="card-value">420</div></div>
    <div class="card"><div class="card-title">Passed</div><div class="card-value" style="color: #10b981;">415</div></div>
    <div class="card"><div class="card-title">Failed</div><div class="card-value" style="color: #ef4444;">5</div></div>
    <div class="card"><div class="card-title">Pass Rate</div><div class="card-value" style="color: #38bdf8;">98.81%</div></div>
  </div>
</body>
</html>
